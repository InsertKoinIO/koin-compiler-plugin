# Verified Kotlin version -> adapter implementation, selected at plugin load.
#
# One line per version verified by tools/abi-check/check-kotlin-abi.sh (core AND the
# adapter class named here). Several versions may share one adapter class when the
# newer version introduced no adapter-level break — 2.4.20 reuses the 2.4.0 adapter
# (0 missing of 19 refs), its four breaks being core-side only. See GH #89 / #99.
#
# Keys are the trust list: a compiler version absent here warns, even inside a
# registered line. Keep in sync with supported-kotlin-versions.txt.
2.3.20=org.koin.compiler.adapter.k2320.Kotlin2320Adapter
2.4.0=org.koin.compiler.adapter.k240.Kotlin240Adapter
2.4.10=org.koin.compiler.adapter.k240.Kotlin240Adapter
2.4.20=org.koin.compiler.adapter.k240.Kotlin240Adapter
