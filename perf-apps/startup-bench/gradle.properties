# 2,756 annotated classes plus the plugin's full-graph safety pass in one compilation unit need more
# than the Kotlin daemon's default heap (OOM observed at the default).
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official
